<script>
const K='luthieria_v2',$=q=>document.querySelector(q);
const SEED={shop:'DP Luthieria',user:'Porto luthieria',seq:1,cli:[],os:[],lan:[],
fam:{'Sopros de madeira':['Saxofone','Clarinete','Flauta transversal','Oboé','Fagote'],'Sopros de metal':['Trompete','Trombone','Trompa','Tuba','Bombardino'],'Cordas':['Violão','Guitarra','Baixo','Cavaquinho','Violino'],'Percussão':['Bateria','Tambor'],'Teclas':['Piano','Acordeão']},
prod:[{id:1,n:'Revisão Sax Soprano',t:'Serviço',m:'',u:'un',c:0,p:600,q:5,min:0,cat:'Serviços'},{id:2,n:'Revisão Sax Tenor',t:'Serviço',m:'',u:'un',c:0,p:850,q:5,min:0,cat:'Serviços'},{id:3,n:'Revisão Sax Alto',t:'Serviço',m:'',u:'un',c:0,p:750,q:12,min:0,cat:'Serviços'},{id:4,n:'Sapatilha (jogo)',t:'Peça/Material',m:'',u:'jogo',c:60,p:90,q:10,min:3,cat:'Sapatilhas'}]};
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||SEED;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10),fd=d=>d?d.split('-').reverse().join('/'):'-',dm=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const uid=()=>Date.now()*100+Math.floor(Math.random()*100);
const ST=['Entrada','Aprovado','Execução','Aguardando','Pronto','Entregue','Cancelado'],IX={Entrada:0,Aprovado:1,Execução:2,Aguardando:2,Pronto:3,Entregue:4,Cancelado:-1};
const NX={Entrada:['Aprovar orçamento','Aprovado'],Aprovado:['Iniciar execução','Execução'],Execução:['Marcar como pronto','Pronto'],Aguardando:['Retomar execução','Execução'],Pronto:['Registrar entrega','Entregue']};
const ABERTA=o=>o.st!='Entregue'&&o.st!='Cancelado',late=o=>ABERTA(o)&&o.prev&&o.prev<today();
const pend=o=>o.st=='Cancelado'?0:o.par.filter(p=>!p.pago).reduce((a,p)=>a+p.v,0),paid=o=>o.par.filter(p=>p.pago).reduce((a,p)=>a+p.v,0);
const cli=id=>D.cli.find(c=>c.id==id)||{n:'(removido)',ins:[]},ini=n=>n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const parc=()=>[...D.os,...D.ven].flatMap(o=>o.par.map((p,k)=>({o,p,k}))).filter(x=>!x.p.pago&&x.o.st!='Cancelado');
const V=i=>$('#'+i).value.trim();
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let FIL='todas',QC='',OT='res',FT='ext',FQ='',FS='',AM=0,UN='un',PH='';

function ask(msg,yes,lbl){const m=document.createElement('div');m.className='ov';m.style.zIndex=99;m.innerHTML=`<div class="md" role="alertdialog" style="max-width:380px"><p style="font-size:16px;margin-bottom:6px">${E(msg)}</p><div class="row f"><button class="bt g" id="ax">Cancelar</button><button class="bt ${lbl&&lbl!='Confirmar'?'':'d'}" id="ay" style="${lbl&&lbl!='Confirmar'?'':'background:var(--r);color:#fff'}">${lbl||'Excluir'}</button></div></div>`;document.body.appendChild(m);$('#ax').onclick=()=>m.remove();$('#ay').onclick=()=>{m.remove();yes()};$('#ay').focus()}
function say(msg,after){const m=document.createElement('div');m.className='ov';m.style.zIndex=99;m.innerHTML=`<div class="md" role="alertdialog" style="max-width:380px"><p style="font-size:16px;margin-bottom:6px">${E(msg)}</p><div class="row f"><button class="bt" id="ay">OK</button></div></div>`;document.body.appendChild(m);$('#ay').onclick=()=>{m.remove();if(after)after()};$('#ay').focus()}
function ask2(t,ph,yes){const m=document.createElement('div');m.className='ov';m.style.zIndex=99;m.innerHTML=`<div class="md" style="max-width:380px"><label>${E(t)}<input id=aq ${ph||''}></label><div class="row f"><button class="bt g" id="ax">Cancelar</button><button class="bt" id="ay">Salvar</button></div></div>`;document.body.appendChild(m);$('#ax').onclick=()=>m.remove();$('#ay').onclick=()=>{const v=$('#aq').value.trim();m.remove();yes(v)};$('#aq').focus()}
function modal(t,body,ok,lbl,sub){const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="md" role="dialog">${sub?'<div class="hd"></div><button class="back x" onclick="this.closest(\'.ov\').remove()" aria-label="Fechar">✕</button>':''}<h3 style="font-size:24px;margin-bottom:${sub?4:14}px">${t}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}<div class="row f"><button class="bt g" id="mx">Cancelar</button><button class="bt" id="mo">${lbl||'Salvar'}</button></div></div>`;document.body.appendChild(m);$('#mx').onclick=()=>m.remove();$('#mo').onclick=()=>{if(ok()!==false)m.remove()}}
function img(f,cb,mx=420){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)}
function theme(t){try{localStorage.setItem('luth_th',t)}catch(e){}go()}
function applyTheme(){let t='auto';try{t=localStorage.getItem('luth_th')||'auto'}catch(e){}document.documentElement.dataset.theme=t=='light'||(t=='auto'&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';return t}

/* Clientes */
const UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
function cliForm(c,cb){c=c||{};const F=(k,ic,ph,v,ex)=>`<div class="fl"><span>${ic}</span><input id=${k} placeholder="${ph}" aria-label="${ph}" value="${E(v)}" ${ex||''}></div>`;
modal(c.id?'Editar cliente':'Cadastrar novo cliente',`<div class="sec"><div class="st">DADOS PESSOAIS</div>${F('k1','☺','Nome completo *',c.n)}${F('k2','▣','CPF ou CNPJ',c.doc,'inputmode=numeric')}</div>
